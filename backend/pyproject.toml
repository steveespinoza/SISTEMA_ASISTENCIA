[project]
name = "sistema-asistencia-api"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.16,<2",
    "flask>=3.1,<4",
    "psycopg[binary]>=3.2,<4",
    "python-dotenv>=1.1,<2",
    "sqlalchemy>=2.0,<2.1",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<10",
    "ruff>=0.11,<1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
